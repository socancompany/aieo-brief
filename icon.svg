<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2458"/><stop offset="1" stop-color="#0a0e26"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="84" y="84" width="856" height="856" rx="160" fill="none" stroke="#2a3268" stroke-width="10"/>
  <!-- LED panel -->
  <rect x="180" y="190" width="664" height="250" rx="44" fill="#070a1f" stroke="#4a2b3a" stroke-width="8"/>
  <text x="512" y="372" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="190" fill="#ff4b4b" filter="url(#glow)" letter-spacing="6">AI</text>
  <!-- rising bars -->
  <rect x="210" y="690" width="120" height="150" rx="22" fill="#3a437a"/>
  <rect x="366" y="610" width="120" height="230" rx="22" fill="#9fb0ff"/>
  <rect x="522" y="560" width="120" height="280" rx="22" fill="#9fb0ff"/>
  <rect x="678" y="500" width="120" height="340" rx="22" fill="#ffb86b"/>
  <circle cx="738" cy="500" r="30" fill="#ff4b4b" filter="url(#glow)"/>
</svg>
